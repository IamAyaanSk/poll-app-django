[project]
name = "poll-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.18",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: Import sorting
# UP: Python syntax modernization
# B: Bugbear (common potential bugs)
# SIM: Simplification
# DJ: Django-specific rules
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

ignore = [
    "E501", # Formatter handles line length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"